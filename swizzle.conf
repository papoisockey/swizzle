[general]
# Window effect
shadow_size=0
shadow_blur=0
shadow_offset=0,0
shadow_color=#00000080
shadow_floating_only=0
corner_radius=0
no_radius_when_single=0
blur_passes=0
blur_radius=5
blur_optimized=0
opacity_focused=1
opacity_unfocused=1
dim_focused=#00000000
dim_unfocused=#00000000

# Animation
animation_duration=150
animation_open=none
animation_close=none
fade_in=1
fade_out=1
fade_in_opacity=0
fade_out_opacity=1
zoom_start=0.5
zoom_end=0.5
tag_animation=fade
layer_animations=0

# Scroll Layout
scroll_width=0.5
scroll_width_single=0
scroll_presets=0.333,0.5,0.667,1
scroll_center=edge
scroll_struts=0

# Master-Stack Layout
attach=top
mfact=0.55
nmaster=1
tag_count=9
smart_gaps=0

# Monocle Layout
monocle_no_border=0
monocle_no_gap=0

# Overview
hotarea_size=0
hotarea_corner=bottom-left
hotarea_fullscreen=0
overview_gap_inner=5
overview_gap_outer=30

# Misc
no_border_when_single=0
focus_on_activate=1
axis_timeout=100
idle_inhibit_hidden=0
idle_inhibit_fullscreen=0
focus_follows_mouse=1
warp_cursor=0
focus_cross_monitor=0
focus_overlap_only=0
focus_cross_tag=0
snap_distance=0
# unset: XCURSOR_SIZE from [env] or the environment, else 24
#cursor_size=24
drag_tile_to_tile=0
drag_tile_small=0
prefer_no_csd=1
mouse_mod=super

# Appearance
gaps=0
scratchpad_width=0
scratchpad_height=0
border_width=2
root_color=#000000
border_normal=#3b4252
drop_color=#88c0d055
border_focus=#88c0d0
border_urgent=#bf616a

[input]
# Keyboard
# unset: XKB_DEFAULT_LAYOUT from the environment, else us
#kb_layout=us
repeat_rate=25
repeat_delay=600
numlock=0

# Pointer
tap=1
tap_drag=1
natural_scroll=0
dwt=1
accel=0
gesture_fingers=3
swipe_threshold=100

[output *]
layout=tile
vrr=fullscreen
tearing=0
direct_scanout=0
# auto: software cursor on virtual machine gpus, hardware cursor elsewhere
hardware_cursor=auto

[bind]
# reload config
super+shift+r=reload

# menu and terminal
super+d=spawn wofi --show drun
super+Return=spawn foot

# exit
super+shift+e=quit
super+q=close

# switch window focus
super+j=focus next
super+k=focus prev
super+Left=focus left
super+Right=focus right
super+Up=focus up
super+Down=focus down

# move window
super+shift+Left=swap left
super+shift+Right=swap right
super+shift+Up=swap up
super+shift+Down=swap down
super+shift+Return=zoom

# switch window status
super+space=floating
super+f=fullscreen
super+s=sticky
super+grave=scratchpad
super+shift+grave=scratchpad move

# layout
super+t=layout next
super+h=mfact -0.05
super+l=mfact +0.05
super+i=nmaster +1
super+o=nmaster -1
super+g=gaps toggle
super+w=width next

# monitor switch
super+comma=focusmon prev
super+period=focusmon next
super+shift+comma=tagmon prev
super+shift+period=tagmon next

# tag switch
super+Tab=view prev
super+0=view all
super+1=view 1
super+2=view 2
super+3=view 3
super+4=view 4
super+5=view 5
super+6=view 6
super+7=view 7
super+8=view 8
super+9=view 9

# tag: move client to the tag
super+shift+0=tag all
super+shift+1=tag 1
super+shift+2=tag 2
super+shift+3=tag 3
super+shift+4=tag 4
super+shift+5=tag 5
super+shift+6=tag 6
super+shift+7=tag 7
super+shift+8=tag 8
super+shift+9=tag 9

# media keys, also behind the lock screen
locked+XF86AudioRaiseVolume=spawn wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
locked+XF86AudioLowerVolume=spawn wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
locked+XF86AudioMute=spawn wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
locked+XF86AudioMicMute=spawn wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
locked+XF86AudioPlay=spawn playerctl play-pause
locked+XF86AudioNext=spawn playerctl next
locked+XF86AudioPrev=spawn playerctl previous
locked+XF86MonBrightnessUp=spawn brightnessctl set 5%+
locked+XF86MonBrightnessDown=spawn brightnessctl set 5%-
